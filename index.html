<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UniVox - Owner Hamza Hafeez</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif}
.top{background:#151515;padding:10px;border-bottom:2px solid gold;display:flex;justify-content:space-between;align-items:center}
.gold{color:gold;font-weight:bold;text-shadow:0 0 10px gold}
.admin{border:2px solid gold;background:#1a1a1a;margin:8px;padding:10px;border-radius:8px;display:none}
.room{padding:10px;margin:4px 0;background:#1e1e1e;border-radius:6px;display:flex;justify-content:space-between;cursor:pointer}
.room.active{border:1px solid gold;background:#2a2210}
.msg{margin:6px 0;padding:8px;background:#222;border-radius:8px;word-break:break-word}
.owner{border-right:4px solid gold}
.btn{background:gold;color:#000;border:0;padding:6px 10px;margin:2px;border-radius:5px;font-weight:bold}
input{padding:7px;border-radius:5px;border:0;margin:2px}
</style>
</head>
<body>
<div class="top">
<div>UniVox | Owner: <span class="gold">Hamza Hafeez</span> <small id="gTxt"></small></div>
<div><button class="btn" onclick="a.style.display=a.style.display=='none'?'block':'none';render()">👑 پینل</button> <button class="btn" onclick="ghost=!ghost;gTxt.innerText=ghost?'[Ghost]':'';alert(ghost?'Ghost Mode ON - آپ چھپ کر جائیں گے':'Ghost OFF - گولڈن نام سے')">👻</button></div>
</div>

<div id="a" class="admin">
<h3 class="gold">Hamza Hafeez - Supreme Control</h3>
<b>قانون کنٹرول (بنائیں / کم کریں)</b><br>
<input id="lawIn" placeholder="نیا قانون لکھیں" style="width:58%"><button class="btn" onclick="addLaw()">Add قانون</button>
<div id="lawList" style="margin:8px 0"></div>
<hr>
<b>چیٹ کنٹرول (زیادہ / کم)</b><br>
<input id="roomIn" placeholder="نئے کمرے کا نام"><button class="btn" onclick="addRoom()">+ کمرہ بناؤ</button>
<div id="roomAdmin" style="margin-top:6px"></div>
</div>

<div style="display:flex;height:80vh">
<div style="width:36%;border-left:1px solid #333;overflow:auto;padding:4px"><div id="rooms"></div></div>
<div style="width:64%;display:flex;flex-direction:column">
<div id="chat" style="flex:1;overflow:auto;padding:8px;background:#111"></div>
<div style="display:flex;padding:6px;gap:3px;background:#151515"><input id="msgIn" placeholder="میسج..." style="flex:1"><input type="file" id="imgF" hidden accept="image/*" onchange="sendImg(event)"><button class="btn" onclick="imgF.click()">📷</button><button class="btn" onclick="sendMsg()">بھیجیں</button></div>
</div>
</div>

<script>
let a=document.getElementById("a"), ghost=false, cur="General"
let rooms=JSON.parse(localStorage.getItem("uv_r")||'["General","Muslim Chat","Fun Zone"]')
let msgs=JSON.parse(localStorage.getItem("uv_m")||"{}")
let laws=JSON.parse(localStorage.getItem("uv_l")||'["عزت سے بات کریں","گالی پر سیدھا بلاک - حکم Hamza Hafeez"]')
function addLaw(){let v=lawIn.value.trim();if(!v)return;laws.push(v);localStorage.setItem("uv_l",JSON.stringify(laws));lawIn.value="";render()}
function delLaw(i){laws.splice(i,1);localStorage.setItem("uv_l",JSON.stringify(laws));render()}
function addRoom(){let v=roomIn.value.trim();if(!v)return;rooms.push(v);localStorage.setItem("uv_r",JSON.stringify(rooms));roomIn.value="";cur=v;render()}
function delRoom(i){if(!confirm(rooms[i]+" ڈیلیٹ کرنا ہے؟"))return;rooms.splice(i,1);localStorage.setItem("uv_r",JSON.stringify(rooms));cur=rooms[0]||"General";render()}
function sendMsg(){let t=msgIn.value.trim();if(!t)return;if(!msgs[cur])msgs[cur]=[];msgs[cur].push({u:ghost?"Anonymous": "Hamza Hafeez",t:t,own:!ghost});localStorage.setItem("uv_m",JSON.stringify(msgs));msgIn.value="";renderChat()}
function sendImg(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{if(!msgs[cur])msgs[cur]=[];msgs[cur].push({u:ghost?"Anonymous":"Hamza Hafeez",img:r.result,own:!ghost});localStorage.setItem("uv_m",JSON.stringify(msgs));renderChat()};r.readAsDataURL(f)}
function render(){roomsDiv.innerHTML=rooms.map(r=>`<div class="room ${r==cur?'active':''}" onclick="cur='${r}';renderChat();render()"><span>${r}</span><span>${r==cur?'●':''}</span></div>`).join("");roomAdmin.innerHTML=rooms.map((r,i)=>`<div class="room">${r} <button class="btn" onclick="delRoom(${i})">کم کریں</button></div>`).join("");lawList.innerHTML=laws.map((l,i)=>`<div> ${i+1}. ${l} <button class="btn" onclick="delLaw(${i})">ڈیلیٹ / کم</button></div>`).join("");renderChat()}
function renderChat(){let m=msgs[cur]||[];chat.innerHTML=`<div style="background:#1a1a1a;border:1px solid gold;padding:7px;border-radius:6px;margin-bottom:8px"><b class="gold">📜 قوانین - Hamza Hafeez</b><br>${laws.map((l,i)=>i+1+". "+l).join("<br>")}</div>`+m.map((x,i)=>`<div class="msg ${x.own?'owner':''}"><b class="${x.own?'gold':''}">${x.u}</b>: ${x.t||""} ${x.img?`<br><img src="${x.img}" style="max-width:160px;border-radius:8px;margin-top:4px">`:""} <button class="btn" onclick="msgs['${cur}'].splice(${i},1);localStorage.setItem('uv_m',JSON.stringify(msgs));renderChat()">ڈیلیٹ</button></div>`).join("");chat.scrollTop=chat.scrollHeight}
let roomsDiv=document.getElementById("rooms"), roomAdmin=document.getElementById("roomAdmin"), lawList=document.getElementById("lawList"), chat=document.getElementById("chat"), msgIn=document.getElementById("msgIn"), lawIn=document.getElementById("lawIn"), roomIn=document.getElementById("roomIn"), imgF=document.getElementById("imgF"), gTxt=document.getElementById("gTxt")
render()
</script>
</body>
</html>
