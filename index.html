‎<!DOCTYPE html>
‎<html>
‎<head>
‎<meta charset="UTF-8">
‎<meta name="viewport" content="width=device-width, initial-scale=1.0">
‎<title>UniVox - Live</title>
‎<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
‎<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
‎<style>
‎*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
‎body{background:#0a0a0a;color:white;display:flex;flex-direction:column;height:100vh}
‎header{background:#111;padding:16px;text-align:center;border-bottom:2px solid #00ff88}
‎#chatBox{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
‎.msg{padding:10px 14px;border-radius:18px;max-width:80%}
‎.me{align-self:flex-end;background:#00ff88;color:#000}
‎.other{align-self:flex-start;background:#222}
‎#inputArea{display:flex;padding:12px;background:#111;gap:10px}
‎#msgInput{flex:1;padding:13px;border-radius:25px;border:none;background:#222;color:white}
‎#sendBtn{padding:13px 22px;border-radius:25px;border:none;background:#00ff88;font-weight:bold}
‎#nameBox{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
‎#nameInput{padding:14px;border-radius:25px;border:none;width:85%;max-width:320px;margin:15px;background:#222;color:white;text-align:center}
‎#joinBtn{padding:12px 30px;border-radius:25px;border:none;background:#00ff88;font-weight:800}
‎</style>
‎</head>
‎<body>
‎<div id="nameBox">
‎<h2>UniVox 🔴 Live</h2>
‎<input id="nameInput" placeholder="Jaise: Hamza">
‎<button id="joinBtn">Join Live Chat</button>
‎</div>
‎<header id="header" style="display:none"><h1>UniVox 🔴 Live</h1><small id="status">Connected ✅</small></header>
‎<div id="chatBox" style="display:none"></div>
‎<div id="inputArea" style="display:none">
‎<input id="msgInput" placeholder="Message likho...">
‎<button id="sendBtn">Send</button>
‎</div>
‎<script>
‎const firebaseConfig = {
‎  apiKey: "AIzaSyC_7-mIBNUIJ3X-lylAiUrUo",
‎  authDomain: "univox-fb833.firebaseapp.com",
‎  databaseURL: "https://univox-fb833-default-rtdb.firebaseio.com",
‎  projectId: "univox-fb833",
‎  storageBucket: "univox-fb833.firebasestorage.app",
‎  messagingSenderId: "45229894681",
‎  appId: "1:45229894681:web:782fb63b8a9b4b8a420e88",
‎  measurementId: "G-XGNP2LDZW7"
‎};
‎firebase.initializeApp(firebaseConfig);
‎const db = firebase.database();
‎const messagesRef = db.ref("messages");
‎let myName = "";
‎function join(){
‎  const n = document.getElementById("nameInput").value.trim();
‎  if(!n) return alert("Naam likho!");
‎  myName = n;
‎  document.getElementById("nameBox").style.display="none";
‎  document.getElementById("header").style.display="block";
‎  document.getElementById("chatBox").style.display="flex";
‎  document.getElementById("inputArea").style.display="flex";
‎  document.getElementById("status").innerText = "Live ✅ - " + myName;
‎  messagesRef.limitToLast(100).on("child_added", snap=>{
‎    const d = snap.val();
‎    const div = document.createElement("div");
‎    div.className = "msg " + (d.name===myName ? "me" : "other");
‎    div.innerHTML = `<small>${d.name}</small>${d.text}`;
‎    document.getElementById("chatBox").appendChild(div);
‎    document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight;
‎  });
‎}
‎document.getElementById("joinBtn").onclick = join;
‎document.getElementById("nameInput").addEventListener("keypress", e=>{ if(e.key==="Enter") join(); });
‎function send(){
‎  const inp = document.getElementById("msgInput");
‎  const text = inp.value.trim();
‎  if(!text) return;
‎  messagesRef.push({ name: myName, text: text, time: Date.now() });
‎  inp.value="";
‎}
‎document.getElementById("sendBtn").onclick = send;
‎document.getElementById("msgInput").addEventListener("keypress", e=>{ if(e.key==="Enter") send(); });
‎</script>
‎</body>
‎</html>
