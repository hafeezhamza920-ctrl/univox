
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniVox - Owner Hamza Hafeez</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#080808;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#151515;border-bottom:2px solid #ffcc00;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:14px} .header h1 span{color:#ffcc00}
.top-controls{display:flex;gap:6px;padding:8px;background:#101010;border-bottom:1px solid #222;justify-content:center;flex-wrap:wrap}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:bold;cursor:pointer;font-size:12px}
.btn-y{background:#ffcc00;color:#000}
.btn-o{background:#1f1f1f;color:#ffcc00;border:1px solid #ffcc00}
.main{flex:1;display:flex;overflow:hidden}
.chat-area{flex:1;display:flex;flex-direction:column;background:#000}
.rules{background:#151515;border:1px solid #ffcc00;margin:8px;border-radius:12px;padding:10px;transition:all 0.3s ease}
.rules.collapsed{height:0;opacity:0;padding:0;margin:0;border:none;overflow:hidden}
.rules h3{color:#ffcc00;text-align:center;font-size:13px;margin-bottom:6px}
.rules p{font-size:11.5px;line-height:1.9;text-align:center;color:#ddd}
#messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{background:#1c1c1c;padding:9px 11px;border-radius:10px;font-size:13px;max-width:85%}
.msg b{color:#ffcc00}
.sidebar{width:150px;background:#111;border-right:1px solid #222;padding:8px;display:flex;flex-direction:column;gap:8px;transition:all 0.3s ease}
.sidebar.hidden{width:0;padding:0;opacity:0;overflow:hidden;border:none}
.room{background:#1e1e1e;padding:10px;border-radius:9px;text-align:center;font-size:12.5px}
.room.active{background:#2a2500;border:1px solid #ffcc00;color:#ffcc00}
.input-bar{display:flex;gap:7px;padding:10px;background:#111;border-top:1px solid #222}
.input-bar input{flex:1;padding:12px;border-radius:10px;border:none;outline:none;background:#1e1e1e;color:#fff}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;gap:6px">
<button class="btn btn-o" onclick="toggleChat()">💬</button>
<button class="btn btn-o" onclick="toggleRules()">📜</button>
</div>
<h1>UniVox | Owner: <span>Hamza Hafeez</span></h1>
</div>
<div class="top-controls">
<button class="btn btn-o" onclick="toggleChat()">💬 چیٹ زیادہ / کم</button>
<button class="btn btn-o" onclick="toggleRules()">📜 قانون زیادہ / کم</button>
</div>
<div class="main">
<div class="chat-area">
<div id="rulesBox" class="rules">
<h3>📜 قوانین - حکم: Hamza Hafeez</h3>
<p>1. سب کی عزت کرو<br>2. گالی پر سیدھا بلاک<br>3. Owner Hamza دیکھ رہا ہے 👑</p>
</div>
<div id="messages">
<div class="msg"><b>System:</b> خوش آمدید UniVox میں! Owner Hamza Hafeez 👑</div>
</div>
<div class="input-bar">
<input id="msgInput" placeholder="میسج لکھیں..." onkeydown="if(event.key==='Enter')sendMsg()">
<button class="btn btn-y" onclick="sendMsg()">بھیجیں</button>
</div>
</div>
<div id="sidebar" class="sidebar">
<div class="room active">💬 General</div>
<div class="room">🕌 Muslim Chat</div>
<div class="room">😂 Fun Zone</div>
<div class="room" style="margin-top:auto;background:#1a1a00;border:1px dashed #ffcc00">👑 Owner<br>Hamza Hafeez</div>
</div>
</div>
<script>
function toggleChat(){document.getElementById('sidebar').classList.toggle('hidden');}
function toggleRules(){document.getElementById('rulesBox').classList.toggle('collapsed');}
function sendMsg(){
let inp=document.getElementById('msgInput'); if(!inp.value.trim()) return;
let box=document.getElementById('messages'); let d=document.createElement('div'); d.className='msg';
d.innerHTML='<b style=color:#ffcc00>You:</b> '+inp.value;
box.appendChild(d); inp.value=''; box.scrollTop=box.scrollHeight;
}
</script>
</body>
</html>
